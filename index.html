<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="Compare WordPress.org plugin activity, ratings, and support metrics at a glance.">
    <title>WP Plugin Pulse — Compare WordPress.org Plugins</title>
    <script>
        (function () {
            try {
                var stored = localStorage.getItem('wp_plugin_pulse_theme');
                var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                var theme = stored === 'light' || stored === 'dark' ? stored : (prefersDark ? 'dark' : 'light');
                document.documentElement.setAttribute('data-theme', theme);
                document.documentElement.style.colorScheme = theme;
                var metaColorScheme = document.querySelector('meta[name="color-scheme"]');
                if (metaColorScheme) {
                    metaColorScheme.content = theme;
                }
            } catch (e) {}
        })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700&display=swap" rel="stylesheet">
</head>

<body>

    <div class="app-shell">

        <header class="site-header">
            <div class="header-inner">
                <div class="brand">
                    <i data-lucide="activity" class="brand-icon" aria-hidden="true"></i>
                    <div>
                        <h1 class="site-title">WP Plugin Pulse</h1>
                        <p class="site-tagline">Compare activity, ratings &amp; support signals for WordPress.org plugins</p>
                    </div>
                </div>
                <div class="header-actions">
                    <button
                        id="theme-toggle"
                        class="theme-toggle-btn"
                        type="button"
                        aria-label="Switch theme"
                        title="Switch theme"
                    >
                        <i data-lucide="sun" class="theme-icon theme-icon--sun" aria-hidden="true"></i>
                        <i data-lucide="moon" class="theme-icon theme-icon--moon" aria-hidden="true"></i>
                    </button>
                </div>
            </div>
        </header>

        <main class="main-content">
            <section class="controls-bar" aria-label="Tag selector">
                <div class="tag-chips" id="tag-chips" role="group" aria-label="Quick tag filters">
                    <button class="chip chip--active" data-tag="form-builder" type="button">Form Builder</button>
                    <button class="chip" data-tag="seo" type="button">SEO</button>
                    <button class="chip" data-tag="woocommerce" type="button">WooCommerce</button>
                    <button class="chip" data-tag="security" type="button">Security</button>
                    <button class="chip" data-tag="performance" type="button">Performance</button>
                    <button class="chip" data-tag="backup" type="button">Backup</button>
                </div>
                <div class="search-wrap">
                    <label for="tag-input" class="sr-only">Custom tag</label>
                    <input
                        type="text"
                        id="tag-input"
                        class="tag-input"
                        placeholder="Search by tag…"
                        autocomplete="off"
                        spellcheck="false"
                    >
                    <button id="tag-submit" class="tag-submit-btn" type="button" aria-label="Load plugins for tag">
                        <i data-lucide="search" aria-hidden="true"></i>
                    </button>
                </div>
            </section>

            <section id="kpi-summary" class="kpi-summary" aria-label="Competitive Landscape" hidden>
                <div class="kpi-summary__header">
                    <h2 class="kpi-summary__title">Competitive Landscape</h2>
                    <p class="kpi-context kpi-summary__context" aria-live="polite"></p>
                </div>
                <div class="kpi-grid" role="list" aria-label="Key performance indicators"></div>
            </section>

            <section class="filter-toolbar" aria-label="Filter and display options">
                <div class="filter-toolbar-inner">
                    <div class="filter-wrap">
                        <label for="filter-input" class="sr-only">Filter loaded plugins</label>
                        <i data-lucide="filter" class="filter-icon" aria-hidden="true"></i>
                        <input
                            type="text"
                            id="filter-input"
                            class="filter-input"
                            placeholder="Filter loaded plugins by name, author, tag, or description…"
                            autocomplete="off"
                            spellcheck="false"
                        >
                        <button id="filter-clear" class="filter-clear-btn" type="button" aria-label="Clear filter" hidden>
                            <i data-lucide="x" aria-hidden="true"></i>
                        </button>
                    </div>
                    <div class="toolbar-actions">
                        <div class="sort-select-wrap">
                            <label for="sort-select" class="sr-only">Sort plugins</label>
                            <select id="sort-select" class="sort-select" aria-label="Sort plugins by attribute and direction">
                                <option value="activeInstalls-desc">Active Installs (High to Low)</option>
                                <option value="activeInstalls-asc">Active Installs (Low to High)</option>
                                <option value="estimatedInstallsPerDay-desc">Estimated Installs / Day (High to Low)</option>
                                <option value="estimatedInstallsPerDay-asc">Estimated Installs / Day (Low to High)</option>
                                <option value="name-asc">Name (A to Z)</option>
                                <option value="name-desc">Name (Z to A)</option>
                                <option value="ratingScore-desc">Rating (High to Low)</option>
                                <option value="ratingScore-asc">Rating (Low to High)</option>
                                <option value="supportResolution-desc">Support Resolution (High to Low)</option>
                                <option value="supportResolution-asc">Support Resolution (Low to High)</option>
                                <option value="lastUpdated-desc">Last Updated (Newest first)</option>
                                <option value="lastUpdated-asc">Last Updated (Oldest first)</option>
                            </select>
                        </div>
                        <div class="view-toggle" role="group" aria-label="View mode">
                            <button
                                id="view-toggle-table"
                                class="view-btn view-btn--active"
                                type="button"
                                data-view="table"
                                aria-pressed="true"
                                aria-label="Table view"
                                title="Dense table comparison view"
                            >
                                <i data-lucide="table" aria-hidden="true"></i>
                                <span class="view-btn-label">Table</span>
                            </button>
                            <button
                                id="view-toggle-cards"
                                class="view-btn"
                                type="button"
                                data-view="cards"
                                aria-pressed="false"
                                aria-label="Card grid view"
                                title="Card grid scan view"
                            >
                                <i data-lucide="layout-grid" aria-hidden="true"></i>
                                <span class="view-btn-label">Cards</span>
                            </button>
                        </div>
                    </div>
                </div>
            </section>

            <div class="results-meta" id="results-meta" aria-live="polite"></div>

            <div id="table-view-wrapper" class="table-wrapper" role="region" aria-label="Plugin comparison table" tabindex="0">
                <table id="plugins-table" aria-label="WordPress.org plugins">
                    <thead>
                        <tr>
                            <th scope="col" data-sort-key="name" aria-sort="none">
                                <button class="th-sort-btn" type="button" aria-label="Sort by Plugin Name. Activate to sort ascending.">
                                    <span>Plugin</span>
                                    <span class="sort-indicator" aria-hidden="true"></span>
                                </button>
                            </th>
                            <th scope="col" class="col-numeric" data-sort-key="estimatedInstallsPerDay" aria-sort="none">
                                <button class="th-sort-btn" type="button" aria-label="Sort by Estimated Installs / Day. Activate to sort descending.">
                                    <span>Estimated Installs / Day</span>
                                    <span class="sort-indicator" aria-hidden="true"></span>
                                </button>
                            </th>
                            <th scope="col" class="col-numeric" data-sort-key="activeInstalls" aria-sort="descending">
                                <button class="th-sort-btn th-sort-btn--active" data-direction="desc" type="button" aria-label="Sort by Active Installs, currently descending. Activate to sort ascending.">
                                    <span>Active Installs</span>
                                    <span class="sort-indicator" aria-hidden="true"></span>
                                </button>
                            </th>
                            <th scope="col" class="col-numeric" data-sort-key="ratingScore" aria-sort="none">
                                <button class="th-sort-btn" type="button" aria-label="Sort by Rating. Activate to sort descending.">
                                    <span>Rating</span>
                                    <span class="sort-indicator" aria-hidden="true"></span>
                                </button>
                            </th>
                            <th scope="col" class="col-numeric" data-sort-key="supportResolution" aria-sort="none">
                                <button class="th-sort-btn" type="button" aria-label="Sort by Support Resolution. Activate to sort descending.">
                                    <span>Support</span>
                                    <span class="sort-indicator" aria-hidden="true"></span>
                                </button>
                            </th>
                            <th scope="col" class="col-numeric" data-sort-key="lastUpdated" aria-sort="none">
                                <button class="th-sort-btn" type="button" aria-label="Sort by Last Updated. Activate to sort descending.">
                                    <span>Last Updated</span>
                                    <span class="sort-indicator" aria-hidden="true"></span>
                                </button>
                            </th>
                        </tr>
                    </thead>
                    <tbody id="plugins-body"></tbody>
                </table>
            </div>

            <div id="cards-view-wrapper" class="cards-wrapper" role="region" aria-label="Plugin cards grid" hidden>
                <div id="plugins-cards" class="cards-grid" role="list" aria-label="WordPress.org plugin cards"></div>
            </div>

            <section id="pagination-controls" class="pagination-controls" aria-label="Pagination and additional results" hidden></section>
        </main>

        <footer class="site-footer">
            <p>Current data from the <a href="https://api.wordpress.org/plugins/info/1.2/" target="_blank" rel="noopener noreferrer">WordPress.org Plugin API</a>, cached daily. Installs/day is an estimate.</p>
        </footer>

    </div>

    <script type="module" src="/src/main.ts"></script>

</body>

</html>
